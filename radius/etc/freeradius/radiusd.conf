prefix = /usr
exec_prefix = /usr
sysconfdir = /etc/freeradius
localstatedir = /var
sbindir = /usr/sbin
logdir = /var/log/freeradius
raddbdir = /etc/freeradius/raddb
radacctdir = /var/log/freeradius/radacct

log {
    destination = files
    file = ${logdir}/radius.log
    syslog_facility = daemon
    stripped_names = no
}

modules {
    # PostgreSQL module for SQL
    sql {
        dialect = "postgresql"
        driver = "rlm_sql_postgresql"
        server = "angaza-postgres"
        port = 5432
        login = "anagaza"
        password = "anagaza123"
        radius_db = "anagaza"
        
        # Connection pooling
        sqltrace = no
        sqltracefile = ${logdir}/sql.log
        num_sql_socks = 5
        connect_failure_retry_delay = 60
        lifetime = 0
        max_queries = 0
        
        # Read groups from table
        read_groups = yes
        
        # Tables configuration
        sqrtable = "radsq"
        authcheck_table = "radcheck"
        authreply_table = "radreply"
        groupcheck_table = "radgroupcheck"
        groupreply_table = "radgroupreply"
        usergroup_table = "radusergroup"
        
        # Query configurations
        authorization_query = "SELECT id, username, attribute, value, op FROM ${authcheck_table} WHERE username = '%{SQL-User-Name}' ORDER BY id"
        authentication_query = "SELECT id, username, attribute, value, op FROM ${authcheck_table} WHERE username = '%{SQL-User-Name}' AND attribute = 'Cleartext-Password' ORDER BY id"
        
        # Acct queries
        accounting_onoff_query = "SELECT radacctid, acctsessionid, username, nasipaddress, nasportid, acctstarttime, acctstoptime, acctsessiontime, acctinputoctets, acctoutputoctets, calledstationid, callingstationid, servicetype, framedprotocol, framedipaddress FROM radacct WHERE username = '%{SQL-User-Name}' AND acctstoptime IS NULL"
        
        postauth_query = "INSERT INTO radpostauth (username, pass, reply, authdate) VALUES ('%{User-Name}', '%{User-Password:-Chap-Password}', '%{Reply-Message}', NOW())"
    }
    
    # PAP for password authentication
    pap {
        encryption_scheme = clear
    }
}

server default {
    listen {
        type = auth
        ipaddr = *
        port = 1812
    }
    listen {
        type = acct
        ipaddr = *
        port = 1813
    }
    
    authorize {
        sql
    }
    
    authenticate {
        Auth-Type PAP {
            pap
        }
        Auth-Type SQL {
            sql
        }
    }
    
    accounting {
        sql
    }
    
    session {
        sql
    }
    
    post-auth {
        sql
    }
}
